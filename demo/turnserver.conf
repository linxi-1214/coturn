# ============================================================
# Coturn Demo 配置文件 / Demo Configuration File
# 用于演示目的，不适合直接用于生产环境。
# For demonstration purposes only, not for direct production use.
# ============================================================

# ---- 网络监听 / Network Listeners ----

# 监听端口（UDP/TCP），默认 3478
listening-port=3478

# TLS/DTLS 监听端口，默认 5349
tls-listening-port=5349

# 监听所有 IPv4 地址；如需绑定特定 IP，请改为实际地址
# Listen on all IPv4; change to a specific IP if needed
listening-ip=0.0.0.0

# 中继地址；如果服务器位于 NAT 后面，请取消注释并填写公网 IP
# Relay IP; uncomment and set to your public IP if behind NAT
#external-ip=YOUR_PUBLIC_IP

# ---- 中继端口范围 / Relay Port Range ----
min-port=49152
max-port=65535

# ---- 认证模式 / Authentication Mode ----
# Demo 使用长期凭证机制（用户名/密码）。
# This demo uses the long-term credential mechanism (username/password).
lt-cred-mech

# 静态用户账户（格式 username:password）
# Static user accounts (format: username:password)
user=demo_user:demo_pass

# 认证域
realm=demo.example.com

# ---- TLS 证书 / TLS Certificates ----
# 取消注释并指向真实证书文件以启用 TLS/DTLS
# Uncomment and point to real certificate files to enable TLS/DTLS
#cert=/path/to/turn_server_cert.pem
#pkey=/path/to/turn_server_pkey.pem

# 因为没有配置证书，在 Demo 中禁用 TLS/DTLS
# TLS/DTLS disabled in this demo since no certificate is configured
no-tls
no-dtls

# ---- 日志 / Logging ----
log-file=stdout
verbose

# ---- 安全 / Security ----
# 禁用 CLI 接口，避免不必要的开放端口
no-cli

# 允许回环地址的对端（仅用于本地测试！生产环境请移除）
# Allow loopback peers (for local testing only! Remove in production)
allow-loopback-peers

# ---- 指纹 / Fingerprint ----
fingerprint
